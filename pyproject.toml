[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "vyana-learning-scaffold"
version = "0.0.1"
description = "Offline learning scaffold for Vyana"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = []
[project.scripts]
vyana = "vyana.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
